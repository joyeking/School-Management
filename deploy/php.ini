; RosarioSIS recommended PHP settings (see INSTALL.md)
; Loaded by the image at /usr/local/etc/php/conf.d/zz-rosariosis.ini

max_execution_time = 240
max_input_vars = 4000
memory_limit = 512M
session.gc_maxlifetime = 3600
upload_max_filesize = 50M
post_max_size = 51M

; RosarioSIS requires this to be Off (diagnostic.php checks it)
session.auto_start = 0

; Do not advertise the PHP version
expose_php = Off

; Performance
opcache.enable = 1
opcache.memory_consumption = 128
